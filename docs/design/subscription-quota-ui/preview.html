    #tw-quota-preview .tw-missing { display: flex; align-items: center; justify-content: space-between; min-height: 51px; color: var(--tw-muted); font-size: 11px; }
    #tw-quota-preview .tw-text-button { background: transparent; border: 0; padding: 4px 0; color: var(--tw-chart); font-size: 11px; }
    #tw-quota-preview .tw-divider { margin: 17px 0 0; height: 1px; background: var(--tw-line); }
    #tw-quota-preview [hidden] { display: none !important; }
    @media (max-width: 440px) {
      #tw-quota-preview .tw-stage { padding: 32px 2px 36px; min-height: 660px; }

      #tw-quota-preview .tw-status-button { gap: 8px; padding: 0 3px; }
      #tw-quota-preview .tw-status-provider { gap: 4px; }
      #tw-quota-preview .tw-status-meters { gap: 4px; }
      #tw-quota-preview .tw-status-window { gap: 2px; }
      #tw-quota-preview .tw-status-value { font-size: 10.5px; width: 27px; }
      #tw-quota-preview .tw-subscription-section { padding: 14px 12px 0; }
      #tw-quota-preview .tw-windows { gap: 12px; }
    }
    @media (pointer: coarse) {
      #tw-quota-preview .tw-text-button { min-height: 44px; }
      #tw-quota-preview .tw-stage { min-height: 730px; }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;tw-quota-preview&#x27;);
      const original = root.querySelector(&#x27;.tw-stage&#x27;);
      const saved = window.openai?.widgetState?.modelContent || {};
      const state = { period: [&#x27;两个周期&#x27;, &#x27;5 小时&#x27;, &#x27;一周&#x27;].includes(saved.period) ? saved.period : &#x27;两个周期&#x27;, ringSize: [20,21,22].includes(saved.ringSize) ? saved.ringSize : 22, colored: saved.colored === true, scenario: [&#x27;正常&#x27;, &#x27;额度偏低&#x27;, &#x27;旧记录&#x27;, &#x27;尚未读取&#x27;].includes(saved.scenario) ? saved.scenario : &#x27;正常&#x27; };
      const stages = [original];
      const base = { claude: [68, 86], codex: [88, 98] };
      const resets = { claude: [&#x27;2 小时 14 分后重置&#x27;, &#x27;3 天 5 小时后重置&#x27;], codex: [&#x27;4 小时 49 分后重置&#x27;, &#x27;6 天 23 小时后重置&#x27;] };
      function persist() {
        const result = window.openai?.setWidgetState?.({ modelContent: { ...state } });
        if (result?.catch) result.catch(() =&gt; {});
      }
      function render() {
        stages.forEach(stage =&gt; {
          stage.style.setProperty(&#x27;--tw-ring-size&#x27;, `${state.ringSize}px`);
          stage.classList.toggle(&#x27;tw-colored&#x27;, state.colored);
          [&#x27;claude&#x27;, &#x27;codex&#x27;].forEach(provider =&gt; {
            const panel = stage.querySelector(`[data-provider=&quot;${provider}&quot;]`);
            const missing = provider === &#x27;claude&#x27; &amp;&amp; state.scenario === &#x27;尚未读取&#x27;;
            const stale = provider === &#x27;claude&#x27; &amp;&amp; state.scenario === &#x27;旧记录&#x27;;
            const values = state.scenario === &#x27;额度偏低&#x27; ? (provider === &#x27;claude&#x27; ? [8, 42] : [88, 18]) : base[provider];
            panel.classList.toggle(&#x27;tw-stale&#x27;, stale);
            panel.querySelector(&#x27;.tw-windows&#x27;).hidden = missing;
            const empty = panel.querySelector(&#x27;.tw-missing&#x27;);
            if (empty) empty.hidden = !missing;
            panel.querySelector(&#x27;.tw-age&#x27;).textContent = missing ? &#x27;需要授权&#x27; : stale ? &#x27;2 小时前 · 旧记录&#x27; : provider === &#x27;claude&#x27; ? &#x27;记录于 2 分钟前&#x27; : &#x27;记录于刚刚&#x27;;
            panel.querySelectorAll(&#x27;.tw-window&#x27;).forEach((element, i) =&gt; {
              element.querySelector(&#x27;strong&#x27;).textContent = `${values[i]}%`;
              element.querySelector(&#x27;.tw-meter&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, values[i]);
              element.querySelector(&#x27;.tw-meter-fill&#x27;).style.width = `${values[i]}%`;
              element.classList.toggle(&#x27;tw-warning&#x27;, values[i] &gt; 10 &amp;&amp; values[i] &lt;= 20 &amp;&amp; !stale);
              element.classList.toggle(&#x27;tw-danger&#x27;, values[i] &lt;= 10 &amp;&amp; !stale);
              element.querySelector(&#x27;.tw-reset&#x27;).textContent = resets[provider][i];
            });
            const statusGroup = stage.querySelector(`[data-status=&quot;${provider}&quot;]`);
            const status = statusGroup.querySelector(&#x27;.tw-status-meters&#x27;);
            const name = provider === &#x27;claude&#x27; ? &#x27;Claude&#x27; : &#x27;Codex&#x27;;
            const ring = i =&gt; {
              const value = values[i];
              const label = i === 0 ? &#x27;5H&#x27; : &#x27;7D&#x27;;
              const description = `${name} ${i === 0 ? &#x27;5 小时&#x27; : &#x27;一周&#x27;}${missing ? &#x27;尚无额度记录&#x27; : `剩余 ${value}%`}${stale ? &#x27;，旧记录&#x27; : &#x27;&#x27;}`;
              const severity = missing ? &#x27;tw-unknown&#x27; : stale ? &#x27;&#x27; : value &lt;= 10 ? &#x27;tw-danger&#x27; : value &lt;= 20 ? &#x27;tw-warning&#x27; : &#x27;&#x27;;
              return `&lt;span class=&quot;tw-status-window ${severity}&quot; role=&quot;progressbar&quot; aria-label=&quot;${description}&quot;${missing ? &#x27;&#x27; : ` aria-valuenow=&quot;${value}&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot;`} data-tooltip=&quot;${description}&quot;&gt;&lt;span class=&quot;tw-ring-glyph&quot; aria-hidden=&quot;true&quot;&gt;&lt;svg class=&quot;tw-status-ring&quot; viewBox=&quot;0 0 20 20&quot;&gt;&lt;circle class=&quot;tw-ring-track&quot; cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;8.8&quot; pathLength=&quot;100&quot;/&gt;&lt;circle class=&quot;tw-ring-fill&quot; cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;8.8&quot; pathLength=&quot;100&quot; stroke-dasharray=&quot;${missing ? 0 : value} 100&quot; transform=&quot;rotate(-90 10 10)&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;tw-agent-icon tw-agent-${provider}&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tw-status-period&quot;&gt;${label}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;tw-status-value&quot;&gt;${missing ? &#x27;—&#x27; : `${value}%`}&lt;/span&gt;&lt;/span&gt;`;
            };
            status.innerHTML = state.period === &#x27;两个周期&#x27; ? ring(0) + ring(1) : ring(state.period === &#x27;一周&#x27; ? 1 : 0);
            statusGroup.style.opacity = stale ? &#x27;.55&#x27; : &#x27;1&#x27;;
          });
          stage.querySelector(&#x27;.tw-new-section-message&#x27;).hidden = true;
        });
      }
      stages.forEach(stage =&gt; {
        stage.querySelector(&#x27;.tw-status-button&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
          const popover = stage.querySelector(&#x27;.tw-popover&#x27;);
          popover.hidden = !popover.hidden;
          event.currentTarget.setAttribute(&#x27;aria-expanded&#x27;, String(!popover.hidden));
        });
        stage.querySelector(&#x27;.tw-connect&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          const message = stage.querySelector(&#x27;.tw-new-section-message&#x27;);
          message.textContent = &#x27;在设置中选择 Claude 额度文件&#x27;;
          message.hidden = false;
        });
      });
      render();
      window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
        const content = event.detail?.globals?.widgetState?.modelContent;
        if (!content) return;
        if ([&#x27;两个周期&#x27;, &#x27;5 小时&#x27;, &#x27;一周&#x27;].includes(content.period)) state.period = content.period;
        if ([20,21,22].includes(content.ringSize)) state.ringSize = content.ringSize;
        if (typeof content.colored === &#x27;boolean&#x27;) state.colored = content.colored;
        if ([&#x27;正常&#x27;, &#x27;额度偏低&#x27;, &#x27;旧记录&#x27;, &#x27;尚未读取&#x27;].includes(content.scenario)) state.scenario = content.scenario;
        render();
      });

    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
